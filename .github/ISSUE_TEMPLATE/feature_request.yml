name: Feature request
description: Suggest an idea or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation in your job search where this would help.
    validations: {required: true}
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: else
    attributes:
      label: Anything else? (optional)
