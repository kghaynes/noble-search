<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noble Search</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#15181d; --muted:#5d6572; --line:#e3e6eb;
  --accent:#1f5eff; --accent-soft:#e8eeff;
  --high:#0f7b4a; --high-bg:#e3f5ec; --med:#8a5a00; --med-bg:#fbf0d9; --low:#6b7280; --low-bg:#eef0f3;
  --star:#c27c00; --applied:#1f5eff; --intv:#7b3fe4; --offer:#0f7b4a; --dismiss:#9aa1ab;
  --new:#d93b3b; --shadow:0 1px 2px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115; --panel:#171a20; --ink:#e8eaee; --muted:#9aa3b0; --line:#2a2f38;
    --accent:#6e97ff; --accent-soft:#1d2640;
    --high:#4cc38a; --high-bg:#123325; --med:#e3b341; --med-bg:#33290f; --low:#9aa3b0; --low-bg:#23272f;
    --star:#f0b429; --applied:#6e97ff; --intv:#b28cff; --offer:#4cc38a; --dismiss:#6b7280; --new:#ff6b6b;
    --shadow:none;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:12px;padding:14px 0 10px;flex-wrap:wrap}
.top h1{font-size:19px;margin:0;font-weight:650;letter-spacing:-.01em}
.sync{color:var(--muted);font-size:13px;flex:1;min-width:180px}
.sync.err{color:var(--new)}
button,select,input,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--accent)}
.tabs{display:flex;gap:4px;padding-bottom:10px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600}
.tab.on{background:var(--accent-soft);color:var(--accent)}
.tab .n{font-weight:500;opacity:.8;margin-left:4px}
.filters{display:flex;gap:8px;padding-bottom:12px;flex-wrap:wrap;align-items:center}
.filters input[type=search]{flex:1;min-width:200px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px}
.filters select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 8px}
.chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;white-space:nowrap}
main{padding:14px 0 60px}
.empty{color:var(--muted);text-align:center;padding:48px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:6px 16px}
.card.dim{opacity:.6}
.card .head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.title{font-size:16px;font-weight:650;text-decoration:none;color:var(--ink)}
.title:hover{color:var(--accent);text-decoration:underline}
.pill{font-size:12px;font-weight:650;border-radius:999px;padding:2px 8px;white-space:nowrap}
.fit-High{color:var(--high);background:var(--high-bg)} .fit-Med{color:var(--med);background:var(--med-bg)} .fit-Low{color:var(--low);background:var(--low-bg)}
.newb{color:#fff;background:var(--new)}
.warn{color:var(--med);background:var(--med-bg)}
.sub{color:var(--muted);font-size:14px}
.sub b{color:var(--ink);font-weight:600}
.meta{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.meta .close{color:var(--new);font-weight:600}
.why{font-size:14px;margin-top:2px}
.main{display:flex;flex-direction:column;gap:4px;min-width:0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:start;min-width:220px}
.actions .st[data-s=dismissed]{grid-column:1 / -1}
.st{border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;text-align:left;color:var(--muted)}
.st:hover{border-color:var(--ink);color:var(--ink)}
.st.on[data-s=interested]{background:var(--star);border-color:var(--star);color:#fff}
.st.on[data-s=applied]{background:var(--applied);border-color:var(--applied);color:#fff}
.st.on[data-s=interviewing]{background:var(--intv);border-color:var(--intv);color:#fff}
.st.on[data-s=offer]{background:var(--offer);border-color:var(--offer);color:#fff}
.st.on[data-s=dismissed]{background:var(--dismiss);border-color:var(--dismiss);color:#fff}
.notes{grid-column:1 / -1}
.notes textarea{width:100%;min-height:38px;resize:vertical;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;font-size:14px}
.notes textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.fbar{background:var(--med-bg);color:var(--med);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:14px}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;font-weight:600;text-decoration:underline;padding:0 4px}
.saved{font-size:12px;color:var(--muted);height:14px}
.nav{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:2px}
.nav button{border:0;background:transparent;padding:5px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55;cursor:default}
.btn.sm{padding:3px 9px;font-size:13px}
.draftbtn{grid-column:1 / -1;border:1px dashed var(--accent);background:transparent;color:var(--accent);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;font-weight:600}
.draftbtn.on{background:var(--accent-soft);border-style:solid}
.dpanel{grid-column:1 / -1;border-top:1px solid var(--line);margin-top:4px;padding-top:12px;display:flex;flex-direction:column;gap:10px}
.dpanel h4{margin:0;font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint{color:var(--muted);font-size:13px}
.hint.err{color:var(--new)}
.dpanel textarea.jd{width:100%;min-height:90px;max-height:320px;resize:vertical;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:13px}
select.inp,input.inp{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 8px}
.ver{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.ver .vh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.ok{color:var(--high);background:var(--high-bg)} .bad{color:var(--new);background:rgba(217,59,59,.12)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.ver ul{margin:2px 0 0 18px;padding:0;font-size:13px}
.ver pre{white-space:pre-wrap;font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:420px;overflow:auto;margin:0}
.page{display:flex;flex-direction:column;gap:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.box h2{font-size:16px;margin:0 0 4px}
.box > .hint{margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.fld input,.fld textarea,.fld select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;color:var(--ink);font-size:14px}
.fld textarea{resize:vertical;min-height:60px}
.fld.full{grid-column:1 / -1}
textarea.inv{width:100%;min-height:420px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;resize:vertical;color:var(--ink)}
.rlist{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.ritem{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);font-size:14px}
.ritem .nm{flex:1;min-width:160px;font-weight:600}
.radio{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--ink)}
.pill.unrated{color:var(--muted);background:transparent;border:1px dashed var(--line)}
.ratedby{font-size:12px;color:var(--muted);margin-top:4px}
.fbox{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;background:var(--bg)}
.fh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.ftxt{white-space:pre-wrap;font-size:13px;margin-top:6px;color:var(--ink)}
.cc{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.cc.over{color:var(--new);font-weight:600}
.fields h5{margin:12px 0 4px;font-size:13px}
.kwbox{margin:8px 0;display:flex;flex-direction:column;gap:4px}
.kwrow{display:flex;flex-wrap:wrap;gap:4px;align-items:center}.kwl{font-size:12px;color:var(--muted);margin-right:4px}
.kw{font-size:12px;border-radius:999px;padding:1px 8px;border:1px solid var(--line)}
.kw.add{background:var(--med-bg);color:var(--med)}.kw.gap{background:var(--low-bg);color:var(--low)}.kw.ok{background:var(--high-bg);color:var(--high)}
details.qs summary{cursor:pointer;margin:4px 0}
.sect{margin:10px 2px 0;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
details.howto{margin:4px 0 10px;font-size:13px}details.howto summary{cursor:pointer;color:var(--accent,#2b59c3);font-weight:600}
details.howto ol{margin:6px 0 0;padding-left:20px;line-height:1.55}details.howto a{color:var(--accent,#2b59c3)}
details.howto code{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.setup{background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:14px 16px;margin:12px 0}
.setup .sh{display:flex;gap:10px;align-items:baseline}.setup ol{list-style:none;margin:8px 0 0;padding:0}
.setup li{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line)}.setup li:first-child{border-top:0}
.setup .ck{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.setup li.done .ck{background:var(--accent);border-color:var(--accent);color:#fff}.setup li.done .linkbtn{color:var(--muted);text-decoration:line-through}
details.adv>summary{cursor:pointer;list-style-position:inside}
.finder{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}
.fh2{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.cand{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;background:var(--bg)}
.cand>div{min-width:0}
.box.info{background:var(--accent-soft)}
ul.srcs{margin:6px 0 8px;padding-left:20px;columns:2;font-size:13px}
@media (max-width:700px){ul.srcs{columns:1}.cand{flex-direction:column;align-items:flex-start}}
details.runlog summary{cursor:pointer;margin:6px 0;line-height:1.6}
details.runlog summary::marker{color:var(--accent)}
.legal{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--panel);border-top:1px solid var(--line);color:var(--muted);font-size:11.5px;line-height:1.4;padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));text-align:center}
.legal a{color:var(--muted)}
body{padding-bottom:56px}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand .tag{font-size:12px;color:var(--muted)}
.qt{border-collapse:collapse;width:100%;font-size:13px}
.qt th,.qt td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.qt th{color:var(--muted);font-weight:600;white-space:nowrap}
.qt .num{text-align:right;font-variant-numeric:tabular-nums}
.qt tr.bad td:first-child{color:var(--new)}
.qt .err{color:var(--new)}
.qb .inp{width:100%;min-width:120px}
.qb .inp.wide{min-width:260px}
.nowrap{white-space:nowrap}
.toast{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:.95}
@media (max-width:700px){
  header{position:static}
  .grid2{grid-template-columns:1fr}
  .card{grid-template-columns:1fr}
  .actions{grid-template-columns:repeat(4,1fr);min-width:0}
  .st{text-align:center;padding:5px 4px}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand"><h1>Noble Search</h1><span class="tag">A job search portal for transitioning military and veterans</span></div>
      <div class="nav" id="nav"><button data-view="jobs" class="on">Jobs</button><button data-view="search">Search</button><button data-view="profile">Profile</button><button data-view="settings">Settings</button></div>
      <div class="sync" id="sync">Loading…</div>
      <span class="jobsonly"><button class="btn" id="btnViewed" title="Clear all NEW badges">Mark all seen</button>
      <a class="btn" href="/jobs/export.csv" style="text-decoration:none">Export CSV</a></span>
    </div>
    <div class="tabs jobsonly" id="tabs"></div>
    <div class="filters jobsonly">
      <input type="search" id="q" placeholder="Search title, company, notes…">
      <select id="fit"><option value="">Any fit</option><option>High</option><option>Med</option><option>Low</option></select>
      <select id="where"><option value="">Anywhere</option><option value="local">Near home</option><option value="remote">Remote</option></select>
      <select id="sort"><option value="posted">Newest posted</option><option value="fit">Best fit</option><option value="closing">Closing soon</option><option value="company">Company</option></select>
      <label class="chk"><input type="checkbox" id="onlyNew"> New only</label>
    </div>
  </div>
</header>
<main class="wrap" id="list"></main>
<main class="wrap" id="view" hidden></main>
<div class="toast" id="toast"></div>
<footer class="legal">Noble Search &copy; 2026 Kenneth Haynes and <a href="https://cybercloudai.tech" target="_blank" rel="noopener">CyberCloudAI.tech</a>. Licensed under the <a href="https://polyformproject.org/licenses/noncommercial/1.0.0/" target="_blank" rel="noopener">PolyForm Noncommercial License 1.0.0</a>. Commercial use or reuse is prohibited without written permission.</footer>

<script>
const S = {findHTML:'', find:null, scr:{}, qsOpen:{}, jobs:[], tab:'inbox', view:'jobs', open:new Set(), drafts:{}, jd:{}, jdMsg:{}, prov:{}, show:{}, counts:{}, settings:null};
const TABS = [
  ['inbox','Inbox', j => !j.watch && j.status!=='dismissed'],
  ['watch','Watchlist', j => j.watch],
  ['applied','Applied+', j => ['applied','interviewing','offer'].includes(j.status)],
  ['dismissed','Dismissed', j => j.status==='dismissed'],
  ['all','All', j => true],
];
const STATUS_BTNS = [['interested','★ Interested'],['applied','Applied'],['interviewing','Interviewing'],['offer','Offer'],['dismissed','✕ Not for me']];
const FITRANK = {High:0, Med:1, Low:2};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function daysAgo(d){
  if(!d || !/^\d{4}-\d{2}-\d{2}/.test(d)) return '';
  const n = Math.round((Date.now() - new Date(d+'T12:00:00'))/864e5);
  return n<=0 ? 'today' : n===1 ? '1 day ago' : `${n} days ago`;
}
function isLocal(j){ return /,\s*FL/i.test(j.location||'') && !/remote/i.test(j.work_mode||''); }
function isRemote(j){ return /remote/i.test((j.work_mode||'')+' '+(j.location||'')); }
function niceDay(d){ return new Date(d+'T12:00:00').toLocaleDateString([], {month:'short', day:'numeric'}); }
function closingSoon(j){
  const m = /^\d{4}-\d{2}-\d{2}/.exec(j.closing_date||''); if(!m) return false;
  const d = (new Date(m[0]+'T23:59:59') - Date.now())/864e5; return d>=0 && d<=7;
}

async function load(){
  const r = await fetch('/jobs/list'); const d = await r.json();
  S.jobs = d.jobs; S.counts = d.draft_counts || {}; S.fitState = d.fit; S.setup = d.setup; renderSync(d.sync, d.search); render();
}
function renderSync(s, q){
  const el = $('#sync'), parts = [];
  let err = false;
  if(q && q.status && q.status.running) parts.push(`Searching… ${q.status.current||''}`);
  else if(q && q.last) parts.push(`Searched ${fmtTime(q.last.finished||q.last.started)} · ${q.last.added} new${q.last.status==='done'?'':' · '+q.last.status}`);
  const f = S.fitState;
  if(f && f.running) parts.unshift(`Rating fit ${f.done}/${f.total}…`);
  else if(f && f.last_error && f.errors) { err = true; parts.push(`Fit rating problem: ${f.last_error}`); }
  el.className = 'sync' + (err ? ' err' : '');
  el.textContent = (parts.length ? parts.join(' · ') : 'Not searched yet') + ` · ${S.jobs.length} jobs`;
  clearTimeout(S.syncPoll);
  if(((q && q.status && q.status.running) || (f && f.running)) && S.view==='jobs') S.syncPoll = setTimeout(load, 15000);
}
function filterState(){
  return {q:$('#q').value.trim().toLowerCase(), fit:$('#fit').value, where:$('#where').value, onlyNew:$('#onlyNew').checked};
}
function filtersOn(f){ return !!(f.q || f.fit || f.where || f.onlyNew); }
function passFilters(j, f){
  return (!f.fit || j.fit===f.fit) &&
    (!f.where || (f.where==='local' ? isLocal(j) : isRemote(j))) &&
    (!f.onlyNew || !j.viewed) &&
    (!f.q || [j.title,j.company,j.location,j.notes,j.fit_reason,j.clearance].join(' ').toLowerCase().includes(f.q));
}
function filtered(){
  const f = filterState();
  const tabFn = TABS.find(t=>t[0]===S.tab)[2];
  let a = S.jobs.filter(tabFn).filter(j => passFilters(j, f));
  const s = $('#sort').value;
  const pd = j => j.posted_date || '0000';
  a.sort((x,y)=>
    s==='fit' ? (FITRANK[x.fit]??3)-(FITRANK[y.fit]??3) || pd(y).localeCompare(pd(x)) :
    s==='closing' ? (x.closing_date||'9999').localeCompare(y.closing_date||'9999') :
    s==='company' ? x.company.localeCompare(y.company) :
    pd(y).localeCompare(pd(x)) || (FITRANK[x.fit]??3)-(FITRANK[y.fit]??3));
  return a;
}
function clearFilters(){
  $('#q').value=''; $('#fit').value=''; $('#where').value=''; $('#onlyNew').checked=false; render();
}
function render(){
  const f = filterState(), on = filtersOn(f);
  $('#tabs').innerHTML = TABS.map(([k,l,fn]) => {
    const all = S.jobs.filter(fn), shown = all.filter(j => passFilters(j, f));
    const nn = shown.filter(j=>!j.viewed).length;
    const count = on && shown.length !== all.length ? `${shown.length} of ${all.length}` : `${all.length}`;
    return `<button class="tab ${S.tab===k?'on':''}" data-tab="${k}">${l}<span class="n">${count}${nn&&k!=='dismissed'?` · ${nn} new`:''}</span></button>`;
  }).join('');
  const a = filtered();
  const tabAll = S.jobs.filter(TABS.find(t=>t[0]===S.tab)[2]).length;
  const hidden = tabAll - a.length;
  const banner = on && hidden > 0 ? `<div class="fbar">Filters are hiding ${hidden} job${hidden>1?'s':''} in this tab. <button class="linkbtn" id="btnClear">Clear filters</button></div>` : '';
  $('#list').innerHTML = setupHTML() + banner + (a.length ? a.map(card).join('') :
    `<div class="empty">${!S.jobs.length ? 'No jobs yet. Finish the getting-started steps above, then run a search.' : S.tab==='watch' && tabAll===0 ? 'Nothing on your watchlist yet. Click ★ Interested on any job to keep it here permanently.' : 'No jobs match these filters.'}</div>`);
  const cb = document.getElementById('btnClear'); if(cb) cb.onclick = clearFilters;
  const hs = document.getElementById('btnHideSetup'); if(hs) hs.onclick = () => { try{ localStorage.setItem('ns_hide_setup','1'); }catch{} render(); };
}
function setupHTML(){
  const s = S.setup; if(!s || s.done) return '';
  let hide = false; try{ hide = localStorage.getItem('ns_hide_setup')==='1'; }catch{}
  if(hide && S.jobs.length) return '';
  const n = s.steps.filter(x=>x.done).length;
  return `<section class="setup"><div class="sh"><b>Getting started</b><span class="hint">${n} of ${s.steps.length} done</span><span style="flex:1"></span>
      ${S.jobs.length?'<button class="linkbtn" id="btnHideSetup">Hide</button>':''}</div>

async function update(key, body){
  const r = await fetch('/jobs/update', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({job_key:key, ...body})});
  if(!r.ok) throw new Error('save failed');
  const j = S.jobs.find(x=>x.job_key===key); if(j){ Object.assign(j, body); j.watch = ['interested','applied','interviewing','offer'].includes(j.status); }
}
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-tab],[data-s],[data-open],[data-draft],[data-view],[data-act]');
  if(!t) return;
  if(t.dataset.tab){ S.tab = t.dataset.tab; render(); return; }
  if(t.classList.contains('st')){
    const key = t.dataset.k, j = S.jobs.find(x=>x.job_key===key);
    const next = j.status===t.dataset.s ? '' : t.dataset.s;
    await update(key, {status: next, viewed: 1}); render(); return;
  }
  if(t.dataset.open){ update(t.dataset.open, {viewed:1}).then(render); return; }
  if(t.dataset.draft !== undefined){ toggleDraft(t.dataset.draft); return; }

});
const timers = {};

const api = async (path, body) => {
  const r = await fetch(path, body===undefined ? {} : {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const d = await r.json().catch(()=>({error:'Bad response'}));
  if(!r.ok) throw new Error(d.error || ('HTTP '+r.status));
  return d;
};
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'), 2200); }
const fmtTime = iso => iso ? new Date(iso).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : '';
async function loadSettings(){ try{ S.settings = await api('/settings'); }catch{} }
function provOptions(sel){

function setView(v){

async function toggleDraft(key){
  if(S.open.has(key)){ S.open.delete(key); render(); return; }
  S.open.add(key); update(key,{viewed:1}).catch(()=>{});
  render(); await refreshDrafts(key);
  if(!(S.jd[key]||'').trim()) autoJD(key);
}
async function refreshDrafts(key){
  try{ const d = await api('/drafts/list?job_key='+encodeURIComponent(key)); S.drafts[key] = d.drafts; }catch(e){ S.drafts[key] = S.drafts[key]||[]; }
  const el = document.getElementById('dp-'+key); if(el) el.innerHTML = panelHTML(key);
  const busy = (S.drafts[key]||[]).some(d => ['queued','running'].includes(d.status));
  clearTimeout(S['poll_'+key]);
  if(busy && S.open.has(key)) S['poll_'+key] = setTimeout(()=>refreshDrafts(key), 4000);
  else if(S.drafts[key]) S.counts[key] = S.drafts[key].filter(d=>d.status==='done').length;
}

const LIMIT = 2000;
function fieldText(a, path){
  if(!a) return '';
  if(path==='skills') return (a.skills||[]).join(', ');
  const [k, i, f] = path.split('.');
  if(i===undefined) return a[k]||'';
  const it = (a[k]||[])[+i]||{};
  return f ? (it[f]||'') : '';
}
async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); }
  catch{ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
}
function fieldBox(key, d, label, path, opts={}){
  const txt = fieldText(d.app, path), n = txt.length, over = n > (opts.limit||LIMIT);
  return `<div class="fbox"><div class="fh"><b>${esc(label)}</b>${opts.sub?`<span class="hint">${esc(opts.sub)}</span>`:''}<span style="flex:1"></span>
    <span class="cc ${over?'over':''}">${n.toLocaleString()} chars${over?' — over '+(opts.limit||LIMIT).toLocaleString():''}</span>
    <button class="btn sm" data-act="copyf" data-id="${d.id}" data-k="${esc(key)}" data-path="${esc(path)}">Copy</button></div>
    <div class="ftxt">${esc(txt)}</div></div>`;
}
function appHTML(key, d){
  const a = d.app || {}, facts = d.facts || [];
  const open = S.show[d.id];
  const head = `<div class="row">
      <button class="btn sm" data-act="view" data-id="${d.id}">${open?'Hide fields':'Show fields'}</button>
      <button class="btn sm" data-act="copy" data-id="${d.id}" data-k="${esc(key)}">Copy all</button>
      ${facts.length?`<span class="pill warn">${facts.length} number${facts.length>1?'s':''} to verify</span>`:`<span class="pill ok">All numbers traced to Profile</span>`}
      ${(a.screening||[]).some(q=>q.verify)?`<span class="pill warn">Screening answers to confirm</span>`:''}</div>
    ${facts.length?`<div class="hint">Not found in your Profile — confirm or remove:<ul>${facts.map(f=>`<li><b>${esc(f.value)}</b> — “${esc(f.context)}”</li>`).join('')}</ul></div>`:''}
    ${kwHTML(d.keywords)}`;
  if(!open) return head;
  return head + `<div class="fields">
    ${fieldBox(key, d, 'Summary / About you', 'summary')}
    <h5>Work history (one entry per role)</h5>
    ${(a.work_history||[]).map((w,i)=>fieldBox(key, d, `${w.job_title} — ${w.company}`, `work_history.${i}.description`, {sub:`${w.from} – ${w.to}${w.location?' · '+w.location:''}`})).join('')}
    ${fieldBox(key, d, 'Skills', 'skills')}
    ${fieldBox(key, d, 'Why this company?', 'why_company')}
    <h5>Screening questions</h5>
    ${(a.screening||[]).map((q,i)=>fieldBox(key, d, q.question, `screening.${i}.answer`, {sub:q.verify?'⚠ confirm before submitting':''})).join('')}
    ${fieldBox(key, d, 'Cover letter', 'cover_letter', {limit:5000})}
    ${a.notes_for_candidate?.length?`<div class="hint">Notes:<ul>${a.notes_for_candidate.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`:''}
  </div>`;
}
function kwHTML(k){
  if(!k) return '';
  if(k.error) return `<div class="hint">${esc(k.error)}</div>`;
  const chip = (x, cls) => `<span class="kw ${cls}">${esc(x.term)}${x.importance==='required'?' *':''}</span>`;
  return `<div class="kwbox"><div class="hint"><b>Keyword check: ${k.score??'–'}% of the posting's key terms are in this draft</b> (* = required)</div>
    ${k.add.length?`<div class="kwrow"><span class="kwl">Add — you have these:</span>${k.add.map(x=>chip(x,'add')).join('')}</div>`:''}
    ${k.gap.length?`<div class="kwrow"><span class="kwl">Not in your Profile:</span>${k.gap.map(x=>chip(x,'gap')).join('')}</div>`:''}
    ${k.covered.length?`<div class="kwrow"><span class="kwl">Covered:</span>${k.covered.map(x=>chip(x,'ok')).join('')}</div>`:''}</div>`;
}
function verHTML(key, d){
  const st = d.status==='done' ? '' : d.status==='error' ? `<span class="pill bad">Failed</span>` :
    `<span class="pill warn"><span class="spin"></span> ${d.status==='running'?'Writing…':'Queued'}</span>`;
  let body = '';
  if(d.status==='error') body = `<div class="hint err">${esc(d.error)}</div>`;
  if(d.status==='done' && d.kind==='application'){
    body = appHTML(key, d);
  } else if(d.status==='done'){
    const ats = d.ats || {checks:[]};

    const facts = d.facts || [];
    body = `
      <div class="row">
        <a class="btn sm primary" href="/drafts/docx?id=${d.id}" style="text-decoration:none">Download .docx</a>
        <button class="btn sm" data-act="copy" data-id="${d.id}" data-k="${esc(key)}">Copy text</button>
        <button class="btn sm" data-act="view" data-id="${d.id}">${S.show[d.id]?'Hide text':'View text'}</button>
        <span class="pill ${ats.pass?'ok':'bad'}">${ats.pass?'ATS check passed':'ATS issues'}${issues.length?` · ${issues.length} note${issues.length>1?'s':''}`:''}</span>
        ${facts.length?`<span class="pill warn">${facts.length} number${facts.length>1?'s':''} to verify</span>`:`<span class="pill ok">All numbers traced to Profile</span>`}
      </div>
      ${facts.length?`<div class="hint">Not found in your Profile — confirm or remove before sending:<ul>${facts.map(f=>`<li><b>${esc(f.value)}</b> — “${esc(f.context)}”</li>`).join('')}</ul></div>`:''}
      ${issues.length?`<div class="hint">ATS: <ul>${issues.map(c=>`<li>${esc(c.name)} — ${esc(c.detail)}</li>`).join('')}</ul></div>`:''}
      ${kwHTML(d.keywords)}
      ${d.notes?.length?`<div class="hint">Writer's notes:<ul>${d.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`:''}

    <span style="flex:1"></span><button class="linkbtn" data-act="del" data-id="${d.id}" data-k="${esc(key)}">Delete</button></div>${body}</div>`;
}
async function onAct(t){
  const a = t.dataset.act, key = t.dataset.k, id = +t.dataset.id;
  try{
    if(a==='rate'){
      await api('/jobs/rate', {job_key:key}); toast('Rating… takes about a minute on the local model');
      S.fitState = {running:true, done:0, total:1}; setTimeout(load, 20000); return;
    }
    if(a==='fetchjd'){
      t.disabled = true; S.jdMsg[key] = {ok:true, text:'Fetching…'}; refreshPanel(key);
      const r = await api('/drafts/fetch-jd', {job_key:key, force:(S.jd[key]||'').trim()!==''});
      if(r.ok || (r.text||'').length > 200) S.jd[key] = r.text;
      S.jdMsg[key] = r.ok ? {ok:true, text:`Got ${r.text.length.toLocaleString()} characters from the ${r.source==='daily search'?'daily search':'posting'} — trim anything irrelevant.`} : {ok:false, text:r.reason};
      refreshPanel(key);
    }
    if(a==='gen'){
      const prov = S.prov[key] || (S.settings && S.settings.provider) || 'ollama';
      if(!(S.jd[key]||'').trim() && !confirm('No job description yet. Draft from the title and company only?')) return;
      const kind = t.dataset.kind || 'resume';
      await api('/drafts/create', {job_key:key, jd_text:S.jd[key]||'', provider:prov, kind, questions:S.scr[key]||''});
      toast(kind==='application' ? 'Application text queued' : 'Resume draft queued'); await refreshDrafts(key);
    }
    if(a==='view'){ S.show[id] = !S.show[id]; refreshPanel(t.closest('.dpanel').id.slice(3)); }
    if(a==='copy'){
      const d = (S.drafts[key]||[]).find(x=>x.id===id);
      await copyText(d.text); toast(d.kind==='application'?'All application text copied':'Resume text copied');
    }
    if(a==='copyf'){
      const d = (S.drafts[key]||[]).find(x=>x.id===id);
      await copyText(fieldText(d.app, t.dataset.path)); toast('Copied'); return;
    }
    if(a==='del'){
      if(!confirm('Delete this draft?')) return;
      await api('/drafts/delete', {id}); await refreshDrafts(key);
    }
    if(a && a.startsWith('p_')) await onProfileAct(a, t);
    if(a && a.startsWith('s_')) await onSettingsAct(a, t);
    if(a && a.startsWith('q_')) await onSearchAct(a, t);
  }catch(e){ toast(e.message); }
  finally{ if(a==='fetchjd') t.disabled = false; }
}
document.addEventListener('change', async e => {
  const t = e.target.closest('[data-act-change]'); if(!t) return;
  try{ await onSearchAct(t.dataset.actChange, t); }catch(err){ toast(err.message); }
});
async function autoJD(key){
  const j = S.jobs.find(x=>x.job_key===key);
  if(!j || !j.has_description) return;               // only auto-load text the daily search saved
  try{
    const r = await api('/drafts/fetch-jd', {job_key:key});
    if(r.ok && !(S.jd[key]||'').trim()){ S.jd[key] = r.text; S.jdMsg[key] = {ok:true, text:`Loaded from the daily search (${r.text.length.toLocaleString()} characters).`}; refreshPanel(key); }
  }catch{}
}
function refreshPanel(key){ const el = document.getElementById('dp-'+key); if(el) el.innerHTML = panelHTML(key); }

      ${inv ? `<div class="ver" style="margin-top:10px"><div class="vh"><b>Generated inventory draft</b><span class="hint">${esc(inv.model)} · ${fmtTime(inv.created)}</span>
          ${inv.status==='done'?'':inv.status==='error'?'<span class="pill bad">Failed</span>':'<span class="pill warn"><span class="spin"></span> Writing…</span>'}</div>
          ${inv.status==='error'?`<div class="hint err">${esc(inv.error)}</div>`:''}
          ${inv.status==='done'?`<div class="row"><button class="btn sm" data-act="p_useinv">Replace my inventory with this</button><button class="btn sm" data-act="p_appinv">Append to my inventory</button></div><pre>${esc(inv.text)}</pre>`:''}</div>` : ''}
    </section>

    <section class="box"><h2>Search preferences</h2><div class="hint">Home location, radius and work modes drive the daily search (towns near home are listed on the Search page). Levels, lanes and notes guide the resume writer.</div>
      <div class="grid2">${PREF.map(([k,l,t])=>f(k,l,t)).join('')}</div>
      <div class="row" style="margin-top:12px"><button class="btn primary" data-act="p_save">Save</button></div></section>
  </div>`;
  $('#upl').onchange = uploadResumes;
  $('#inv').oninput = () => { $('#invstat').textContent = 'Unsaved changes'; };
  if(inv && ['queued','running'].includes(inv.status)){ clearTimeout(S.invPoll); S.invPoll = setTimeout(()=>{ if(S.view==='profile') renderProfileKeep(); }, 5000); }
}
async function renderProfileKeep(){ const cur = $('#inv') && $('#inv').value; const dirty = $('#invstat') && $('#invstat').textContent==='Unsaved changes';
  await renderProfile(); if(dirty && cur!==undefined){ $('#inv').value = cur; $('#invstat').textContent='Unsaved changes'; } }
async function uploadResumes(e){
  for(const file of e.target.files){
    if(!file.name.toLowerCase().endsWith('.docx')){ toast(file.name+': only .docx'); continue; }
    const b64 = await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result.split(',')[1]); fr.onerror=rej; fr.readAsDataURL(file); });
    try{ await api('/profile/upload', {filename:file.name, data_b64:b64}); toast('Uploaded '+file.name); }catch(err){ toast(file.name+': '+err.message); }
  }
  renderProfile();
}
async function onProfileAct(a, t){
  if(a==='p_save'){
    const p = {}; document.querySelectorAll('[data-pf]').forEach(el => p[el.dataset.pf] = el.value);
    await api('/profile/save', {profile:p}); toast('Profile saved');
  }
  if(a==='p_saveinv'){ await api('/profile/save', {inventory:$('#inv').value}); $('#invstat').textContent = 'Saved · '+$('#inv').value.length.toLocaleString()+' characters'; toast('Inventory saved'); }
  if(a==='p_tpl'){ await api('/profile/set-template', {name:t.dataset.name}); toast('Layout template set'); }
  if(a==='p_delres'){ if(!confirm('Remove '+t.dataset.name+'?')) return; await api('/profile/delete-resume', {name:t.dataset.name}); renderProfile(); }
  if(a==='p_buildinv'){ await api('/profile/build-inventory', {provider:$('#invprov').value}); toast('Inventory draft queued'); renderProfileKeep(); }
  if(a==='p_useinv' || a==='p_appinv'){
    const inv = S.profile.inventory_drafts[0].text;
    const cur = $('#inv').value;
    if(a==='p_useinv' && cur.trim() && !confirm('Replace your current inventory?')) return;
    $('#inv').value = a==='p_useinv' ? inv : (cur.trim() ? cur.trimEnd()+'\n\n'+inv : inv);
    $('#invstat').textContent = 'Unsaved changes'; toast('Review, then Save inventory');
  }
}

function collectSettings(){

  const p = document.querySelector('input[name=prov]:checked'); if(p) d.provider = p.value; return d;
}
function collectSearchSettings(){
  const d = {};
  document.querySelectorAll('[data-sq]').forEach(el => d[el.dataset.sq] = el.value);
  document.querySelectorAll('[data-sqb]').forEach(el => d[el.dataset.sqb] = el.checked);
  document.querySelectorAll('[data-sqs]').forEach(el => { const v = el.value.replace(/\s+/g,''); if(v) d[el.dataset.sqs] = v; });
  const f = document.querySelector('input[name=fitp]:checked'); if(f) d.fit_provider = f.value;
  return d;
}

        <li>Copy the address from the browser bar. Workday addresses look like <code>company.wd1.myworkdayjobs.com/External</code>.</li>
        <li>Click <b>Add employer manually</b> below, type the name and paste the address. "Detect from link" works out how to read it.</li>
        <li>Click <b>Run</b> on that row to check it reads jobs.</li></ol></details>
      <div style="overflow-x:auto"><table class="qt qb"><thead><tr><th>Company</th><th>Job search link</th><th>Read as</th><th></th></tr></thead><tbody id="qboards">${S.qBoards.map(boardRow).join('')}</tbody></table></div>
      <div class="row" style="margin-top:8px"><button class="btn" data-act="q_addb">Add employer manually</button></div>
    </section>
    <section class="box"><h2>Job-board searches (JSearch)</h2>
      <div class="hint">Each line is one search; {home} is your home town; lines with "remote" look for remote jobs anywhere. Each line uses one request per run.${c.jsearch_key_set?'':' <b>Add your JSearch key on Settings to turn this on.</b>'}</div>
      <div class="grid2">
        <label class="fld full">Searches (one per line)<textarea id="q_jq" rows="7" placeholder="director information technology in {home}
chief information security officer remote">${esc(c.jsearch_queries)}</textarea></label>
        <div class="row full"><button class="btn" data-act="q_suggest" data-what="searches">✨ Suggest searches from my Profile</button><span class="hint" id="sg_searches"></span></div>
        <label class="fld">Result pages per search (10 jobs each)<input id="q_jpages" type="number" min="1" max="5" value="${esc(c.jsearch_pages)}"></label>
        <label class="fld full">Skip these re-posting sites (one per line)<textarea id="q_jskip" rows="4">${esc(c.jsearch_skip_sites)}</textarea>
          <span class="hint">Some sites copy jobs from elsewhere; their copies are often out of date and sometimes fake. Links to these sites are never used — a job is kept only if the employer's own link or a known board (LinkedIn, Indeed…) is available.</span></label>
        <div class="fld"><span>Estimated use</span><b style="color:var(--ink)">about ${d.jsearch_monthly} requests a month</b><span class="hint">Free plans allow 200 a month.</span></div>
      </div></section>
    <section class="box"><h2>What counts as a match</h2>
      <div class="grid2">
        <label class="fld full">Start from a preset<select id="q_preset" data-act-change="q_preset"><option value="">Choose a level…</option>${Object.entries(d.title_presets||{}).map(([k,p])=>`<option value="${k}">${esc(p.label)}</option>`).join('')}</select>
          <span class="hint">Fills the list below; edit it any way you like. "*" means any title.</span></label>
        <label class="fld">Title must contain one of (one per line)<textarea id="q_inc" rows="10">${esc(c.title_include)}</textarea></label>
        <label class="fld">Skip titles containing (one per line)<textarea id="q_exc" rows="10">${esc(c.title_exclude)}</textarea></label>
        <label class="fld full">Towns that count as near home (one per line, "Town, ST")<textarea id="q_places" rows="6" placeholder="Leave empty to use only your home town from the Profile">${esc(c.local_places)}</textarea>
          <span class="row" style="margin:4px 0"><button class="btn" type="button" data-act="q_suggest" data-what="towns">✨ Suggest towns near my home</button><span class="hint" id="sg_towns"></span></span>
          <span class="hint">Remote jobs are kept too when your Profile work modes include Remote. Lines are matched as words; advanced users can use regular expressions.</span></label>
        <label class="fld">Federal jobs: lowest grade to keep (GS)<input id="q_ugrade" type="number" min="1" max="15" value="${esc(c.usajobs_min_grade)}"></label>
      </div></section>
    <div class="row"><button class="btn primary" data-act="q_save">Save search settings</button></div>
  </div>`;
  const rl = v.querySelector('details.runlog'); if(rl) rl.addEventListener('toggle', () => { S.runOpen = rl.open; });
  clearTimeout(S.qPoll);
  if(st.running || d.fit.running) S.qPoll = setTimeout(()=>{ if(S.view==='search') renderSearch(true); }, 5000);
}
function findResult(r){
  const steps = `<details class="howto"><summary>What it checked</summary><ol>${r.log.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></details>`;
  if(!r.candidates.length) return `<div class="fbar" style="margin-top:8px">${esc(r.tip)}</div>${steps}`;
  return `<div class="hint" style="margin:8px 0 4px">Found ${r.candidates.length===1?'this job list':'these job lists'} for <b>${esc(r.name)}</b>. Pick the main one (usually the one with the most jobs):</div>
    ${r.candidates.map((c,i)=>`<div class="cand"><div><b>${esc(c.label)}</b> · ${c.jobs.toLocaleString()} open jobs · <span class="hint">${esc(c.how)}</span>
      <div class="hint" style="word-break:break-all">${esc(c.url)}</div>${c.sample.length?`<div class="hint">e.g. ${c.sample.map(esc).join(' · ')}</div>`:''}</div>
      <button class="btn primary" data-act="q_pick" data-i="${i}">Add to my list</button></div>`).join('')}
    ${r.unsupported.length?`<div class="hint">Also saw: ${r.unsupported.map(esc).join(', ')} (can't be read).</div>`:''}${steps}`;
}
function boardRow(b, i){
  return `<tr data-bi="${i}"><td><input class="inp" data-b="name" value="${esc(b.name)}"></td>
    <td><input class="inp wide" data-b="url" value="${esc(b.url)}">${b.note?`<div class="hint">${esc(b.note)}</div>`:''}</td>
    <td><select class="inp" data-b="type">${QTYPES.map(([k,l])=>`<option value="${k}" ${(b.type||'auto')===k?'selected':''}>${k==='auto'&&b.detected&&b.detected!=='auto'?`Auto (${esc(S.search.readers[b.detected]||b.detected)})`:l}</option>`).join('')}</select></td>
    <td class="nowrap"><button class="linkbtn" data-act="q_one" data-i="${i}">Run</button> · <button class="linkbtn" data-act="q_delb" data-i="${i}">Remove</button></td></tr>`;
}
function readBoards(){
  document.querySelectorAll('#qboards tr').forEach(tr => { const b = S.qBoards[+tr.dataset.bi]; tr.querySelectorAll('[data-b]').forEach(el => b[el.dataset.b] = el.value.trim()); });
  return S.qBoards.filter(b => b.name && b.url).map(({name,url,type,note}) => ({name,url,type,note}));
}
function collectSearch(){
  const days = [...document.querySelectorAll('[data-qday]')].filter(x=>x.checked).map(x=>x.dataset.qday).join(',');
  return {enabled:$('#q_enabled').checked, run_time:$('#q_time').value, days, timezone:$('#q_tz').value, max_age_days:$('#q_age').value,
    usajobs_min_grade:$('#q_ugrade').value, title_include:$('#q_inc').value, title_exclude:$('#q_exc').value,
    local_places:$('#q_places').value, boards: readBoards(), jsearch_queries:$('#q_jq').value, jsearch_pages:$('#q_jpages').value, jsearch_skip_sites:$('#q_jskip').value};
}
async function onSearchAct(a, t){
  if(a==='q_save'){ await api('/search/save', collectSearch()); toast('Search settings saved'); S.qBoards=null; renderSearch(); }
  if(a==='q_run'){ await api('/search/save', collectSearch()); await api('/search/run', {}); toast('Search started'); S.qBoards=null; renderSearch(true); }
  if(a==='q_one'){ await api('/search/save', collectSearch()); const b = S.qBoards[+t.dataset.i]; await api('/search/run', {only:[b.name]}); toast('Checking '+b.name); S.qBoards=null; renderSearch(true); }
  if(a==='q_rate'){ await api('/jobs/rate', {}); toast('Rating started'); renderSearch(true); }
  if(a==='q_find'){
    const name = $('#f_name').value.trim(), site = $('#f_site').value.trim();
    if(!name){ toast('Type the company name'); return; }
    readBoards(); t.disabled = true;
    S.findHTML = `<div class="hint"><span class="spin"></span> Looking for ${esc(name)}'s job list… this takes up to a minute.</div>`; $('#f_out').innerHTML = S.findHTML;
    try{
      const r = await api('/search/discover', {name, website:site}); S.find = r;
      S.findHTML = findResult(r); $('#f_out').innerHTML = S.findHTML;
    }finally{ t.disabled = false; }
  }
  if(a==='q_pick'){
    const c = S.find.candidates[+t.dataset.i]; readBoards();
    if(S.qBoards.some(b => b.url===c.url)){ toast('Already in your list'); return; }
    S.qBoards.push({name:S.find.name, url:c.url, type:'auto', note:`Found automatically (${c.label}, ${c.jobs.toLocaleString()} open jobs)`});
    await api('/search/save', collectSearch()); S.findHTML=''; S.qBoards=null; toast(S.find.name+' added'); renderSearch();
  }
  if(a==='q_addb'){ readBoards(); S.qBoards.push({name:'',url:'',type:'auto'}); $('#qboards').innerHTML = S.qBoards.map(boardRow).join(''); }
  if(a==='q_delb'){ readBoards(); S.qBoards.splice(+t.dataset.i,1); $('#qboards').innerHTML = S.qBoards.map(boardRow).join(''); }
  if(a==='q_preset'){ const v = $('#q_preset').value; if(!v) return; const pr = S.search.title_presets[v];
    if($('#q_inc').value.trim() && !confirm('Replace the title list with "'+pr.label+'"?')) { $('#q_preset').value=''; return; }
    $('#q_inc').value = pr.include; toast('Title list filled in — click Save search settings'); }
  if(a==='q_suggest'){
    const what = t.dataset.what, box = what==='towns' ? $('#q_places') : $('#q_jq'), out = $('#sg_'+what);
    if(box.value.trim() && !confirm('Replace what is in this box with AI suggestions?')) return;
    t.disabled = true; out.className='hint'; out.innerHTML = '<span class="spin"></span> Asking the AI model…';
    try{ const r = await api('/search/suggest', {what}); box.value = r.text; out.textContent = '✓ '+r.detail; }
    catch(e){ out.className='hint err'; out.textContent = '✗ '+(e.message||e); }
    finally{ t.disabled = false; }
  }
}

/* ============================== start ============================== */
load();
loadSettings();
</script>
</body>
</html>
